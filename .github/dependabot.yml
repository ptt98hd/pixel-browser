version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    commit-message: { prefix: "build(deps)" }
    groups:
      gradle-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    commit-message: { prefix: "ci(deps)" }
    groups:
      github-actions:
        patterns: ["*"]
